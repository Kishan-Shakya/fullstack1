<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
        padding: 0px;
        margin: 0px;
        }
         .c{
            display: inline-flex;
            overflow-x: scroll;
            scrollbar-width: none;
            width: 100vw;
            overflow: scroll;
        }

        .d1 {
            background-color: aliceblue;
        }

        .d2 {
            background-color: aqua;
        }

        .d3 {
            background-color: black;
            color: aliceblue;
        }
        .d4 {
            background-color: rgb(165, 137, 137);
        }
        .d5 {
            background-color: rgb(161, 9, 9);
        }
        .d1,.d2,.d3,.d4,.d5{
            min-width: 100vw;
            height: 100vw;
            position: sticky;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="c">
        <div class="d1">
            1
        </div>
        <div class="d2">
            2
        </div>
        
        <div class="d3">
            3
        </div>
        <div class="d4">
            4
        </div>
        <div class="d5">
            5
        </div>
    </div>
</body>

</html>
