<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            padding: 0px;
            margin: 0px;
        }

        nav {
            display: flex;
            width: 100%;
            height: 50px;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .left>h1 {
            color: red;
            font-family: Arial, sans-serif;
        }

        .center>input {
            justify-content: center;
            width: 400px;
            height: 35px;
            border-radius: 100px;
            border: 0px;
            background-color: rgb(230, 226, 226);

        }

        .right>img {
            width: 50px;
            height: 40px;
            border-radius: 50%;
        }

        .container {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fill,minmax(300px,1fr));
            grid-auto-rows: 50px;
        }

        .box {
            display: flex;
            border: 2px solid black;
            border-radius: 15px;
            justify-content: center;
        }

        #box1 {
            grid-row: span 12;
            background-color: antiquewhite;
        }

        #box2 {
            grid-row:span 8;
            background-color: aqua;
        }

        #box3 {
            grid-row: span 15;
            background-color: aquamarine;
        }

        #box3 {
            grid-row: span 20;
            background-color: blueviolet;
        }

        #box4 {
            grid-row: span 12;
            background-color: burlywood;
        }

        #box5 {
            grid-row:span 19;
            background-color: darkolivegreen;
        }

        #box6 {
            grid-row:span 22;
            background-color: aqua;
        }

        #box7 {
            grid-row: span 15;
            background-color: cadetblue;
        }

        #box8 {
            grid-row:span 12;
            background-color: darkcyan;
        }

        #box9 {
            grid-row:span 20;
            background-color: goldenrod;
        }

        #box10 {
            grid-row: span 10;
            background-color: navajowhite;
        }
    </style>
</head>

<body>
    <nav>
        <div class="left">
            <h1>TilePress</h1>
        </div>
        <div class="center">
            <input type="text" name="" id="" placeholder="Search for ideas">
        </div>
        <div class="right">
            <img src="img\erwin shrodinger.webp" alt="img">
        </div>
    </nav>

    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
        <div class="box" id="box6">box6</div>
        <div class="box" id="box7">box7</div>
        <div class="box" id="box8">box8</div>
        <div class="box" id="box9">box9</div>
        <div class="box" id="box10">box10</div>
    </div>
</body>

</html>
