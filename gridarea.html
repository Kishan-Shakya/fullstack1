<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            height: 400px;
            width: 400px;
            grid-template-areas:
                "b1 b1 b2 b3"
                "b1 b1 b4 b5"
                "b1 b1 b6 b5"
                "b7 b7 b8 b5"
                "b9 b9 b9 b9"
            ;
            gap: 10px;
            outline: 1px dashed grey;
        }

        .container>div {
            outline: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 3px 3px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box1"><button style="grid-area:b1;"></button></div>
        <div class="box2" style="grid-area: b2;">2</div
        <div class="box3" style="grid-area: b3;">3</div>
        <div class="box4" style="grid-area: b4;">4</div>
        <div class="box5" style="grid-area: b5;">5</div>
        <div class="box6" style="grid-area: b6;">6</div>
        <div class="box7" style="grid-area: b7;">7</div>
        <div class="box8" style="grid-area: b8;">8</div>
        <div class="box9" style="grid-area: b9;">9</div>
    </div>
</body>

</html>
