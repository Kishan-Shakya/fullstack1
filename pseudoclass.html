<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        button{
            
            height: 150px;
            width: 300px;
            border-color: aqua;
            border-radius: 15px;
            font-size: 40px;
        }
        button:hover{
            background-color: black;
            color: white;
        }
        button:active{
            background-color: yellow;
            color: black;
        }
        button:focus{
            background-color: grey;
            box-shadow: 3px 3px 5px grey;
        }
        a:link{
            font-size: 40px;
            color: red;
            background-color: black;
        }
        a:visited{
            color: yellow;
        }
        a:hover{
            background-color: aliceblue;
        
        }
        input:checked{
            accent-color: red;
        }
        input:not(:checked){
            box-shadow: 0px 0px 5px black;
        }
    </style>
</head>
<body>
    <input type="checkbox" checked>
    <button >click meee!</button>
    <a href="OIP.jpg"> link</a>
</body>
</html>
