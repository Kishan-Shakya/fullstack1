<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            width: 300px;
            height:200px;
            font-size: 20px;
        }
        button:active{
            background-color: aquamarine;
            font-size: 40px;
        }
        button:focus{
            border:5px solid blue;
        }
        a:link{
            color: rgb(206, 24, 24);
            text-decoration: none;
        }
        a:visited{
            color: darkcyan;
        }

    </style>
</head>
<body>
    <button>
        click meeee!
    </button>
    <a href="http://127.0.0.1:5500/selectors.html">Link click</a>
</body>
</html>
