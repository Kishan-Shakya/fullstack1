<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .b1 {
            width: 450px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(36, 34, 34);
        }

        .b11 {
            width: 350px;
            height: 30px;
            background: linear-gradient(to left, white, yellow, red);
            border-radius: 15px;
        }
    </style>
</head>

<body>
    <div class="b1">
        <div class="b11"></div>
    </div>
</body>
</html>
