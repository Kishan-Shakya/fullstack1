<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contianer{
            grid-template-rows: repeat(3,1fr);
            gap: 15px;
        }
        #box1{
            grid-column-start:1;
            grid-column-start: 3;
            grid-row-start: 1;
            grid-row-end: 3;
        }
        .container>div{
            box-shadow: 0 0 5px gray;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1"><p>1</p></div>
        <div id="box2"><p>2</p></div>
        <div id="box3"><p>3</p></div>
        <div id="box4"><p>4</p></div>
        <div id="box5"><p>5</p></div>
        <div id="box6"><p>6</p></div>
        <div id="box7"><p>7</p></div>
        <div id="box8"><p>8</p></div>
        <div id="box9"><p>9</p></div>
        <div id="box10"><p>10</p></div>
    </div>
</body>
</html>
