<head>

    <style>
      section h2{

      }
      section>h2{
        color: gray;
      }

      }

        <h2>parent</h2>
        <p>child 1 </p>
        <p>child 2</p>
        <div>
            <h2>child 3</h2>
            <p> grand child 1</p>
        </div>
    </section>
</body>
