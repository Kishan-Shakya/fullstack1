<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
        }

        .box1 {
            background-color: black;
            flex-basis: 100px;
            flex-grow: 3;
            flex-shrink: 1;
        }

        .box2 {
            background-color: aliceblue;
            flex-basis: 100px;
            flex-grow: 1;
            flex-shrink: 1;
        }

        .box3 {
            background-color: aqua;
            flex-basis: 100px;
            flex-grow: 1;
            flex-shrink: 1;
        }

        .box4 {
            background-color: red;
            flex-basis: 100px;
            flex-grow: 1;
            flex-shrink: 1;
        }

        .box5 {
            background-color: aquamarine;
            flex-basis: 100px;
            flex-grow: 1;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4" 4></div>
        <div class="box5">5</div>
    </div>
</body>

</html>
