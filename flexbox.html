<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            width: 90vw;
            height: 90vh;
            outline: 2px   solid black;
            flex-direction: column;   /*main axis    */
            align-items: center;   /* center along perpendicular of main axis*/
            justify-content: center; /* center in main axis*/
        }
        .box,.box2{
            width: 200px;
            height: 200px;
            background-color: aquamarine;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box2"></div>
        
    </div>
</body>
</html>
